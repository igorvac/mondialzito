; PlatformIO Project Configuration
; NodeMCU v3 (ESP8266Mod) — Controlador de Temperatura
;
; Setup:
;   1. Instale a extensão PlatformIO no VS Code
;   2. Abra a pasta firmware/boiler_controller/ no VS Code
;   3. PlatformIO detecta este arquivo automaticamente
;
; Comandos:
;   Ctrl+Alt+B  → Build
;   Ctrl+Alt+U  → Upload
;   Ctrl+Alt+S  → Serial Monitor (115200 baud)

[env:nodemcuv2]
platform  = espressif8266
board     = nodemcuv2
framework = arduino

; Bibliotecas (instaladas automaticamente pelo PlatformIO)
lib_deps =
    bblanchon/ArduinoJson @ ^6

; Upload via USB (ajuste a porta se necessário — PlatformIO detecta automaticamente)
upload_speed   = 921600
monitor_speed  = 115200

; Otimização de tamanho (útil para ESP8266 com pouca RAM)
build_flags =
    -Os
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
