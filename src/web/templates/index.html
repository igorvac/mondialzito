<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controlador de Temperatura</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0d1117; color: #c9d1d9; font-family: monospace; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; }
    .card-title { color: #8b949e; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.25rem; }
    .temp-display { font-size: 3.5rem; font-weight: 700; color: #f85149; line-height: 1; }
    .temp-unit { font-size: 1.5rem; color: #8b949e; }
    .ssr-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .ssr-dot.on  { background: #3fb950; box-shadow: 0 0 8px #3fb950; }
    .ssr-dot.off { background: #484f58; }
    .form-control, .form-range { background: #0d1117; color: #c9d1d9; border-color: #30363d; }
    .form-control:focus { background: #0d1117; color: #c9d1d9; border-color: #58a6ff; box-shadow: none; }
    #controlBtn.running { background: #da3633; border-color: #da3633; }
    #controlBtn.stopped { background: #238636; border-color: #238636; }
    canvas { max-height: 340px; }
  </style>
</head>
<body>
<div class="container-fluid py-3 px-4">
  <h4 class="mb-3 text-center" style="color:#58a6ff">Controlador de Temperatura — Caldeira</h4>

  <div class="row g-3">
    <!-- Chart column -->
    <div class="col-xl-8">
      <div class="card p-3 h-100">
        <canvas id="tempChart"></canvas>
      </div>
    </div>

    <!-- Controls column -->
    <div class="col-xl-4 d-flex flex-column gap-3">

      <!-- Current temp -->
      <div class="card p-3 text-center">
        <div class="card-title">Temperatura Atual</div>
        <div>
          <span class="temp-display" id="currentTemp">---</span>
          <span class="temp-unit">°C</span>
        </div>
      </div>

      <!-- Status row -->
      <div class="card p-3 d-flex flex-row align-items-center gap-3">
        <span class="ssr-dot off" id="ssrDot"></span>
        <span>SSR: <strong id="ssrLabel">OFF</strong></span>
        <span class="ms-auto badge" id="runBadge" style="background:#484f58">Parado</span>
      </div>

      <!-- Setpoint -->
      <div class="card p-3">
        <div class="card-title">Setpoint (°C)</div>
        <div class="d-flex gap-2 align-items-center">
          <input type="range" class="form-range flex-grow-1" id="spSlider" min="0" max="300" step="1" value="100">
          <input type="number" class="form-control text-center" id="spInput" min="0" max="300" value="100" style="width:72px">
        </div>
        <div class="text-center mt-1" style="color:#58a6ff;font-size:1.1rem">
          Alvo: <strong id="spDisplay">100</strong> °C
        </div>
      </div>

      <!-- PID parameters -->
      <div class="card p-3">
        <div class="card-title mb-2">Parâmetros PID</div>
        <form id="pidForm">
          <div class="row g-2">
            <div class="col-4">
              <label class="form-label small" style="color:#8b949e">Kp</label>
              <input type="number" class="form-control form-control-sm text-center" id="kpIn" step="0.01" value="1.0">
            </div>
            <div class="col-4">
              <label class="form-label small" style="color:#8b949e">Ki</label>
              <input type="number" class="form-control form-control-sm text-center" id="kiIn" step="0.001" value="0.05">
            </div>
            <div class="col-4">
              <label class="form-label small" style="color:#8b949e">Kd</label>
              <input type="number" class="form-control form-control-sm text-center" id="kdIn" step="0.01" value="0.1">
            </div>
          </div>
          <button type="submit" class="btn btn-sm btn-outline-secondary w-100 mt-2">Aplicar PID</button>
          <div class="text-success small mt-1 text-center" id="pidOk" style="display:none">✓ Aplicado</div>
        </form>
      </div>

      <!-- Start / Stop -->
      <button class="btn btn-lg w-100 stopped" id="controlBtn">▶ Iniciar</button>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="/static/main.js"></script>
</body>
</html>
